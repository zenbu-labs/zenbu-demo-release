<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="zenbu-bg" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="zenbu-bg" content="#09090b" media="(prefers-color-scheme: dark)">
<title>Installing</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #18181b;
    --muted: #71717a;
    --spinner: #18181b;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --fg: #f4f4f5;
      --muted: #71717a;
      --spinner: #f4f4f5;
      --error: #ef4444;
    }
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-app-region: drag;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 32px;
    box-sizing: border-box;
  }
  .spinner {
    width: 18px;
    height: 18px;
    border: 1.5px solid color-mix(in srgb, var(--spinner) 20%, transparent);
    border-top-color: var(--spinner);
    border-radius: 50%;
    animation: spin 700ms linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .label {
    font-size: 14px;
    color: var(--fg);
    min-height: 1.4em;
    text-align: center;
  }
  .message {
    font-size: 11px;
    color: var(--muted);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    max-width: min(420px, 90%);
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-height: 1.4em;
  }
  body.error .spinner {
    display: none;
  }
  body.error .label {
    color: var(--error);
  }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="label" id="label">Starting&hellip;</div>
  <div class="message" id="message"></div>
  <script>
    const api = window.zenbuInstall;
    const labelEl = document.getElementById("label");
    const messageEl = document.getElementById("message");

    if (api) {
      api.on("step", (p) => {
        if (p && p.label) labelEl.textContent = p.label;
      });
      api.on("message", (p) => {
        if (p && p.text) messageEl.textContent = p.text;
      });
      api.on("done", () => {
        messageEl.textContent = "";
      });
      api.on("error", (p) => {
        document.body.classList.add("error");
        labelEl.textContent = "Failed";
        if (p && p.message) messageEl.textContent = p.message;
      });
    }
  </script>
</body>
</html>
